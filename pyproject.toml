[project]
name = "flappyfly"
version = "0.1.0"
description = "The male Drosophila connectome, as a spiking reservoir, playing Flappy Bird"
readme = "README.md"
authors = [
    { name = "Numan khan", email = "n82238895@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pygame>=2.6.1",
    "scipy>=1.18.1",
]

[project.scripts]
flappyfly = "flappyfly.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
